# Blueprint do Render: API e site do Agenda Inteligente. O banco fica no Neon, fora do Blueprint.
# Passo a passo do deploy e a lista das variáveis: docs/deploy.md. Decisões: D105 a D119.
#
# Nenhum segredo neste arquivo. JWT_SECRET e RATE_LIMIT_KEY_SECRET são gerados pelo Render
# (generateValue: um valor aleatório de 256 bits em base64). O que tem sync: false é pedido pelo
# painel só na criação do Blueprint, e uma sincronização posterior nunca o sobrescreve.
#
# Campos conferidos na documentação do Render em 13/11/2026:
#   https://render.com/docs/blueprint-spec       (todos os campos abaixo)
#   https://render.com/docs/free                 (plan: free, uma instância, dorme em 15 min)
#   https://render.com/docs/deploys              (sem pre-deploy no grátis; falha mantém a versão anterior)
#   https://render.com/docs/python-version       (PYTHON_VERSION)
#   https://render.com/docs/uv-version           (uv pelo uv.lock; UV_VERSION)
#   https://render.com/docs/node-version         (NODE_VERSION)
#   https://render.com/docs/health-checks        (healthCheckPath)
#   https://render.com/docs/static-site-headers  (headers)
#   https://render.com/docs/redirects-rewrites   (routes)
#   https://render.com/docs/custom-domains       (domains e renderSubdomainPolicy)

services:
  - type: web
    name: agenda-api
    runtime: python
    plan: free
    # Ao lado do Neon em AWS us-east-1 (D115). Não muda depois da criação.
    region: virginia
    rootDir: backend
    # Só publica um commit da main depois de o CI passar.
    autoDeployTrigger: checksPass
    # D107: CNAME api-agenda -> endereço onrender.com deste serviço (docs/deploy.md, passo 7).
    # O endereço onrender.com continua ligado até o domínio funcionar; desligá-lo
    # (renderSubdomainPolicy: disabled) fica para um PR seguinte (docs/deploy.md, passo 9).
    domains:
      - api-agenda.kaikyjefferson.dev
    # D114: o Render instala o uv porque há um uv.lock em backend/.
    buildCommand: uv sync --frozen --no-dev
    # D113: sem pre-deploy no plano grátis, as migrações rodam antes do uvicorn, pela conexão
    # direta do Neon; se uma falha, a API não sobe e o Render mantém a versão anterior.
    # uv run --no-sync usa o ambiente que o build instalou, sem conferir nem baixar dependências
    # a cada partida a frio. 1 processo: o worker e a restauração vivem nele (D105, D106).
    startCommand: uv run --no-sync alembic upgrade head && exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    # D118: /health não consulta o banco, para o Neon poder dormir. O banco é conferido no /ready.
    healthCheckPath: /health
    envVars:
      # As versões do backend/Dockerfile.
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: UV_VERSION
        value: 0.13.7
      # D115: Neon, conexão direta (sem -pooler), no formato postgresql+asyncpg://…?ssl=require,
      # sem channel_binding.
      - key: DATABASE_URL
        sync: false
      # D116: gerados pelo Render (44 caracteres, acima dos 32 exigidos).
      - key: JWT_SECRET
        generateValue: true
      - key: RATE_LIMIT_KEY_SECRET
        generateValue: true
      - key: REGISTRATION_ENABLED
        value: "false"
      # D109 e D110: a única origem do CORS e do Origin conferido no refresh e no logout.
      - key: CORS_ALLOWED_ORIGINS
        value: https://agenda.kaikyjefferson.dev
      # Base dos links nos e-mails.
      - key: FRONTEND_BASE_URL
        value: https://agenda.kaikyjefferson.dev
      # D118: o cabeçalho com o IP do visitante, como no Estoque. Conferido no teste de fumaça.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: True-Client-IP
      # D111: envio pelo Resend, de mail.kaikyjefferson.dev. Sem a chave, a API não sobe.
      - key: EMAIL_BACKEND
        value: resend
      - key: EMAIL_FROM
        value: Agenda Inteligente <nao-responda@mail.kaikyjefferson.dev>
      - key: RESEND_API_KEY
        sync: false
      # O limite de 100 por dia do Resend grátis é da conta: somado aos outros projetos, até 100.
      - key: EMAIL_DAILY_CAP
        value: "100"
      - key: EMAIL_RECIPIENT_DAILY_CAP
        value: "3"
      # D105: o worker de e-mails dentro da API (não há background worker grátis).
      - key: EMAIL_WORKER_IN_PROCESS
        value: "true"
      # D106: a restauração diária da demo dentro da API; ligada, exige o DEMO_PASSWORD.
      - key: DEMO_RESTORE_IN_PROCESS
        value: "true"
      # D44: a senha das duas contas da demo, de 12 a 128 caracteres. Igual ao VITE_DEMO_PASSWORD.
      - key: DEMO_PASSWORD
        sync: false

  # Static site: sem plan e sem region (servido por uma CDN global).
  - type: web
    name: agenda-site
    runtime: static
    rootDir: frontend
    autoDeployTrigger: checksPass
    # D107: CNAME agenda -> endereço onrender.com deste serviço (docs/deploy.md, passo 7).
    domains:
      - agenda.kaikyjefferson.dev
    # D114. O build falha se o VITE_API_BASE_URL não estiver no connect-src da CSP.
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Rotas do React abrem o index.html; um arquivo que existe no caminho é servido antes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # D117. O Render não documenta qual regra vence quando duas definem o mesmo cabeçalho, então
    # cada cabeçalho aparece em uma regra só (o Cache-Control, só em /assets/*).
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Exatamente CONTENT_SECURITY_POLICY de frontend/csp.ts: o CI falha se os dois divergirem
      # (npm run check:render, em frontend/scripts/check-render.ts). A conferência lê cada chave
      # numa linha e o valor sem aspas ou entre aspas duplas, como aqui.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api-agenda.kaikyjefferson.dev; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      # Os arquivos de /assets têm o hash do conteúdo no nome.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Lidas no build (npm run build): mudar qualquer uma exige um novo deploy do site.
      - key: NODE_VERSION
        value: 24.22.2
      # D116: a origem da API, sem caminho nem barra no fim, que precisa estar no connect-src.
      - key: VITE_API_BASE_URL
        value: https://api-agenda.kaikyjefferson.dev
      # D75: a senha do atalho da demo em /entrar, igual ao DEMO_PASSWORD da API. Vai no
      # JavaScript público: só a senha da demo, nunca a de uma conta real.
      - key: VITE_DEMO_PASSWORD
        sync: false
