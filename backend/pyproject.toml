[project]
name = "agenda-inteligente-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
