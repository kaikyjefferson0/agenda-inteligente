# End-to-end tests (D102). Run through `npm run test:e2e` in frontend/, which
# prepares the database before starting the API. A project of its own, with
# ports of its own (5175 and 8003), so it never touches the development stack
# (5174, 8002, 5433) nor its data. Every value here is for the tests only.
name: agenda-e2e

x-backend-env: &backend-env
  # D102: prepare_e2e_database refuses any database not ending in _e2e.
  DATABASE_URL: postgresql+asyncpg://agenda:agenda_e2e@db:5432/agenda_e2e
  JWT_SECRET: somente-e2e-nao-usar-em-producao-0001
  RATE_LIMIT_KEY_SECRET: somente-e2e-nao-usar-em-producao-0002
  # No worker in the E2E: the link comes from the success screen, and the fake
  # backend guarantees no message ever leaves (docs/05).
  EMAIL_BACKEND: fake
  DEMO_PASSWORD: senha-da-demo-somente-e2e
  REGISTRATION_ENABLED: "false"
  CORS_ALLOWED_ORIGINS: http://localhost:5175
  # The access_url of a booking must open the E2E frontend.
  FRONTEND_BASE_URL: http://localhost:5175
  TRUSTED_CLIENT_IP_HEADER: ""

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda_e2e
      POSTGRES_DB: agenda_e2e
    # In memory: nothing survives `down`. The database is also recreated by
    # prepare_e2e_database on every run.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    environment: *backend-env
    # Without --reload and without the bind mount: the code baked in the image.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    build: ./frontend
    environment:
      # D52: vite preview forwards /api to the API, on the same origin.
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_API_BASE_URL: ""
      # D75: baked into the JavaScript by the build, as in production.
      VITE_DEMO_PASSWORD: senha-da-demo-somente-e2e
    # D102: the production build, so the E2E catches what only breaks there
    # (VITE_ variables, lazy route chunks, minified code).
    command: ["sh", "-c", "npm run build && npm run preview"]
    ports:
      - "127.0.0.1:5175:5174"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5174/ || exit 1"]
      interval: 3s
      timeout: 5s
      start_period: 120s
      retries: 40
