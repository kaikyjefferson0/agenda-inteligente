name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend (Ruff e mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  backend-tests:
    name: Backend (migrações e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda_ci
          POSTGRES_DB: agenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://agenda:agenda_ci@localhost:5432/agenda
      JWT_SECRET: somente-ci-nao-usar-em-producao-0001
      RATE_LIMIT_KEY_SECRET: somente-ci-nao-usar-em-producao-0002
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Aplicar migrações do zero
        run: uv run alembic upgrade head
      - name: Conferir modelos e migrações
        run: uv run alembic check
      - name: Testes com cobertura (mínimo de 80%)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Cobertura das regras de domínio (mínimo de 90%)
        run: uv run coverage report --include="app/domain/*" --fail-under=90
      # D51: the OpenAPI used by the frontend must match the API.
      - name: Conferir o openapi.json do frontend
        run: uv run python -m app.scripts.export_openapi --check ../frontend/src/api/openapi.json

  frontend:
    name: Frontend (ESLint, tsc, Vitest e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: Testes com cobertura (mínimo de 80% em src/lib e src/api)
        run: npm run test:coverage
      # D51: the types must be regenerated whenever openapi.json changes.
      - name: Conferir o schema.d.ts
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts
      - name: Build
        run: npm run build

  # D102 to D104: the whole system (production build of the frontend, API and
  # a database of its own) from docker-compose.e2e.yml, with Playwright on the
  # runner. A flaky test fails the job (failOnFlakyTests).
  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      # The browsers of the project's own Playwright, so the versions match.
      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Instalar o Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependências de sistema do Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Testes ponta a ponta
        run: npm run test:e2e
      - name: Guardar relatório, traces e capturas
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem do backend
        run: docker build ./backend
      - name: Build da imagem do frontend
        run: docker build ./frontend
        